<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Arial, sans-serif">
  <style>
    .lbl { font-size: 26px; font-weight: bold; fill: #333; }
    .dim { font-size: 20px; fill: #555; }
  </style>
  <rect x="0" y="0" width="900" height="760" fill="#FFFFFF"/>
  <text x="40" y="50" class="lbl">Cat head icon · 220 × 220 px (shown at 2.5×)</text>
  <text x="40" y="80" class="dim">Dialogue screen, top-right corner at 1660, 30. PNG with transparency.</text>

  <!-- Canvas 220 at scale 2.5 = 550 -->
  <g transform="translate(60,130) scale(2.5)">
    <rect x="0" y="0" width="220" height="220" fill="#F4EEE6" stroke="#7A5A30" stroke-width="1.6"/>
    <rect x="12" y="12" width="196" height="196" fill="none" stroke="#B08850" stroke-width="0.8" stroke-dasharray="4 3"/>
    <!-- rough head silhouette -->
    <path d="M60 150 L52 50 L90 82 Q110 76 130 82 L168 50 L160 150 Q110 190 60 150 Z" fill="#CDBBA0" stroke="#7A5A30" stroke-width="1"/>
    <!-- pivot -->
    <circle cx="110" cy="196" r="4" fill="#C0392B"/>
    <line x1="110" y1="12" x2="110" y2="208" stroke="#C0392B" stroke-width="0.6" stroke-dasharray="3 3"/>
  </g>

  <g class="dim">
    <text x="640" y="170">Outer line: 220 × 220</text>
    <text x="640" y="200">canvas edge</text>
    <text x="640" y="250">Dashed: keep the head</text>
    <text x="640" y="280">inside a 12 px margin</text>
    <text x="640" y="310">(the swing must not</text>
    <text x="640" y="340">cut the ears)</text>
    <text x="640" y="400" fill="#C0392B">Red dot: swing pivot</text>
    <text x="640" y="430" fill="#C0392B">110, 196 (neck, centre)</text>
    <text x="640" y="490">Swing is done in code:</text>
    <text x="640" y="520">small rotation, about ±8°</text>
    <text x="640" y="580">One image, no frames.</text>
  </g>
</svg>
