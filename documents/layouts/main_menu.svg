<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, sans-serif">
  <style>
    .lbl { font-size: 30px; font-weight: bold; fill: #333; }
    .dim { font-size: 24px; fill: #555; }
    .sm { font-size: 20px; fill: #555; }
    .menu { font-family: 'Courier New', monospace; font-size: 60px; fill: #2f2a2e; text-anchor: middle; }
    .box { fill: none; stroke: #b0558a; stroke-width: 2; stroke-dasharray: 8 6; }
  </style>
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#ECECEC"/>
  <rect x="4" y="4" width="1912" height="1072" fill="none" stroke="#999" stroke-width="4" stroke-dasharray="20 12"/>
  <text x="1880" y="1010" text-anchor="end" class="lbl">Title background bg_title (bottle on the right)</text>
  <text x="1880" y="1048" text-anchor="end" class="dim">0, 0 · 1920 × 1080 · no title, no panel</text>

  <!-- Logo -->
  <rect x="88" y="194" width="810" height="110" class="box"/>
  <text x="493" y="268" text-anchor="middle" font-family="Courier New, monospace" font-size="84" fill="#333">BONDING POTION</text>
  <rect x="110" y="284" width="766" height="4" fill="#333"/>
  <text x="88" y="336" class="sm">ui_logo 88, 194 · 810 × 110 (transparent)</text>

  <!-- Menu panel -->
  <rect x="255" y="420" width="490" height="570" rx="30" fill="#E3D6DC" stroke="#9a8a96" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="280" y="435" width="440" height="100" class="box"/>
  <rect x="280" y="545" width="440" height="100" class="box"/>
  <rect x="280" y="655" width="440" height="100" class="box"/>
  <rect x="280" y="765" width="440" height="100" class="box"/>
  <rect x="280" y="875" width="440" height="100" class="box"/>
  <text x="500" y="505" class="menu">START</text>
  <text x="500" y="615" class="menu">CONTINUE</text>
  <text x="500" y="725" class="menu">LOAD</text>
  <text x="500" y="835" class="menu">SETTINGS</text>
  <text x="500" y="945" class="menu">CREDITS</text>
  <text x="255" y="1020" class="sm">ui_menu_panel 255, 420 · 490 × 570</text>
  <text x="780" y="465" class="sm">Buttons = images of the words (ui_title_*),</text>
  <text x="780" y="493" class="sm">440 × 100 each, transparent, at x 280,</text>
  <text x="780" y="521" class="sm">y 435, 545, 655, 765, 875 (every 110 px).</text>
  <text x="780" y="549" class="sm">Pink + slightly bigger on hover (by the game).</text>
  <text x="780" y="577" class="sm">Continue only with a save; without it the</text>
  <text x="780" y="605" class="sm">others move up and the panel is 460 high.</text>
</svg>
